# Dense window: one snapshot EVERY MINUTE from 17:08 to 17:47 IST -- covers the covered-call
# buy-back (17:20-17:29), Delta's daily expiry (17:30) and the new sale (17:35).
# Starts at 17:00 IST (11:30 UTC) so GitHub's usual start delay does not eat the window.
# Also audits YESTERDAY for half-hour slots that never ran (written to that day's missing.csv).
name: evening window (every minute 17:08-17:47 IST)

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      from_ist:
        description: "window start HH:MM IST (for a test run)"
        default: "17:08"
      until_ist:
        description: "window end HH:MM IST (for a test run)"
        default: "17:47"

permissions:
  contents: write

concurrency:
  group: evening
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Snapshot every minute
        run: >
          python collector.py --out _out --tag evening --every 60
          --from-ist "${{ inputs.from_ist || '17:08' }}"
          --until-ist "${{ inputs.until_ist || '17:47' }}"
        continue-on-error: true
      - name: Audit yesterday's half-hour slots
        run: python audit.py _out "$(date -u -d yesterday +%Y-%m-%d)"
        continue-on-error: true
      - name: Commit and push
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python publish.py _out "evening $(date -u +%Y-%m-%d)"
